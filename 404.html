<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deck Zero · Link lost</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2; url=./">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://zeubi403-jpg.github.io/deck-zero/">
<style>
:root{--void:#020805;--phos:#4dff9a;--ink:#a8c4b4;--line:rgba(77,255,154,.22);--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--void);color:var(--ink);font-family:Georgia,serif}
html[lang="en"] [data-lang="fr"]{display:none!important}
html[lang="fr"] [data-lang="en"]{display:none!important}
body{
  display:flex;align-items:center;justify-content:center;
  padding:calc(1.25rem + env(safe-area-inset-top)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
  background:radial-gradient(ellipse 55% 40% at 50% 0%, rgba(77,255,154,.09), transparent 55%),linear-gradient(180deg,#030906,#07140f);
}
.card{
  width:min(28rem,100%);border:1px solid var(--line);background:rgba(2,8,5,.92);
  padding:1.35rem 1.4rem;border-radius:10px;
}
.kicker{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#2a8f58;margin-bottom:.7rem}
h1{font-family:var(--mono);font-weight:500;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;color:#d4f0e0;margin-bottom:.75rem}
p{line-height:1.55;margin-bottom:1.1rem}
a{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--phos);text-decoration:none;border:1px solid var(--line);
  padding:.55rem .75rem;min-height:44px;display:inline-flex;align-items:center;
  background:rgba(77,255,154,.12);
}
a:hover{background:rgba(77,255,154,.2)}
</style>
<script>
(function(){
  var q = new URLSearchParams(location.search).get("lang");
  var lang = (q === "fr" || q === "en") ? q : null;
  if (!lang) {
    try { var s = localStorage.getItem("dz-lang"); if (s === "fr" || s === "en") lang = s; } catch (_) {}
  }
  if (!lang) lang = (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
  document.documentElement.lang = lang;
  document.title = lang === "fr" ? "Deck Zero · Lien perdu" : "Deck Zero · Link lost";
})();
setTimeout(function(){location.replace("./");},1800);
</script>
</head>
<body>
<main class="card">
  <div class="kicker">Ashen-Null · fiber hash</div>
  <h1 data-lang="en">Link lost</h1>
  <h1 data-lang="fr">Lien perdu</h1>
  <p data-lang="en">No cleared page at this address. Returning to the terminal.</p>
  <p data-lang="fr">Aucune page déclassifiée à cette adresse. Retour au terminal.</p>
  <div style="display:flex;flex-wrap:wrap;gap:.55rem">
    <a href="./"><span data-lang="en">Open terminal</span><span data-lang="fr">Ouvrir le terminal</span></a>
    <a href="./wiki/" style="background:transparent;color:#8aab9a"><span data-lang="en">Wiki vault</span><span data-lang="fr">Coffre wiki</span></a>
  </div>
</main>
</body>
</html>
